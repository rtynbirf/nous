forge: # калибровка R1 (тикет 0001). Протокол TOFU (ADR-0006, спека 01):
  # значение с пометкой null фиксируется ПЕРВЫМ реальным прогоном и далее
  # сверяется принудительно; выдуманные хеши в реестре запрещены (аксиома 2).
  # URL — только официальные каналы (спека 01: зеркалам нет).
  debian-netinst:
    status: calibrated-live
    # ТОЧНАЯ версия, не current/: Debian 12 ушёл в архив (current = 13.7.0,
    # живой прогон 40865005039 поймал раскалибровку). Детерминизм артефакта
    # важнее автодогоняния свежих точечных релизов (аксиома 2, ADR-0006).
    channel: "https://cdimage.debian.org/cdimage/archive/12.15.0/amd64/iso-cd/"
    pattern: "debian-12.15.0-amd64-netinst.iso"
    checksums: "SHA256SUMS в том же каталоге официального канала"
    signing: "gpg-подпись SHA256SUMS (debian-cd); fingerprint ключа фиксируется TOFU при первом прогоне"
    # TOFU-фиксация прогона 40865639337 (FETCH сверил сумму с официальным SHA256SUMS);
    # отпечаток сверен с официальной страницей debian.org/CD/verify — «Debian CD signing key»
    iso_sha256: "cd4462c06aa8892e692c0c4b9c17802f38c8ab8690e85cbfb5ccaa5956e9af17"
    key_fingerprint: "DF9B9C49EAA9298432589D76DA87E80D6294BE9B"
    verified_at: "2026-10-29"
    method: "канал/файл/сумма/ключ: живой прогон FETCH + debian.org/CD/verify"
  ubuntu-server:
    status: calibrated-live
    # Точная точечная версия (философия debian-netinst): сортировка индекса
    # не должна выбирать «старшую из найденных» — артефакт детерминирован.
    channel: "https://releases.ubuntu.com/24.04/"
    pattern: "ubuntu-24.04.5-live-server-amd64.iso"
    checksums: "SHA256SUMS + SHA256SUMS.gpg в том же каталоге официального канала"
    signing: "gpg-подпись; fingerprint ключа фиксируется TOFU при первом прогоне"
    iso_sha256: null
    key_fingerprint: null
    verified_at: "2026-10-29"
    method: "URL и формат сверены по официальному releases.ubuntu.com; SHA256/ключ — первый прогон forge-linux"
  fido:
    status: pending-first-run
    repo: "pbatard/Fido"
    pin: "релиз-тег + SHA256 скрипта фиксируются при первом прогоне (TOFU), далее сверка"
    tag: null
    sha256: null
    verified_at: "2026-10-29"
    method: "репозиторий подтверждён (официальное происхождение, спека 03); тег/SHA — первый прогон forge-win"
  windows-image:
    status: pending-first-run
    channel: "официальный канал образов Microsoft через Fido (спека 03)"
    edition: "Windows 11 Pro x64"
    iso_sha256: null
    verified_at: "2026-10-29"
    method: "SHA256 ISO фиксируется TOFU при первом форже; oscdimg — ADK на хосте владельца"
