name: "Доктор гейтов — самозажив транзиентов (волна 7)"

# КЛАСС КОСЯКА (вскрыт байтами волной 7, 2026-11-11, на телах singulyar и
# uace-pml): красный гейта при ЗДОРОВОМ теле — транзиент инфраструктуры
# (инцидент хранилища GitHub Actions 2026-11-10: BlobNotFound в «Set up job»,
# «Timeout reached» на Upload artifact при живом дереве; тот же SHA зелёный
# повторным прогоном). ПРИКАЗ ХОЗЯИНА (волна 8): «прикрутить Доктора к
# остальным телам роя».
# ВАРИАНТ ТЕЛА (nous держит свой закон: tests/test_workflows.py — триггер
# workflow_run запрещён, checkout с persist-credentials: false обязателен,
# верхний permissions несёт contents: read, пины — manifests/pins.yaml
# ADR-0010). Поэтому здесь Доктор ходит ДОЗОРОМ по расписанию: класс и
# конечный автомат канона сохранены один-в-один.
# ЛЕКАРСТВО (класс, не симптом): ровно ОДИН реран упавших jobs каждого
# красного attempt=1, найденного дозором.
# КОНЕЧНЫЙ АВТОМАТ (закон дома): attempt=1 красный → реран → attempt=2 —
#   ФИНАЛЬНОЕ состояние (не лечится никогда — guard run_attempt==1);
#   доктор доктора запрещён (guard по имени Доктора и событию);
#   повторный дозор того же run безопасен: attempt уже 2.
# ТИШИНА (I0): реран не создаёт нотификаций, не пишет issue/комментарии.
# ЧЕСТНОСТЬ: отклонённый реран — честная строка в лог, exit 0; красный гейт
#   не подмазывается.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: doctor-poll
  cancel-in-progress: false

jobs:
  heal:
    name: "Дозор: один реран упавших jobs (attempt 2 — финал)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "checkout (закон тела: persist-credentials: false)"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Дозор: реран упавших jobs attempt=1 (только API)"
        env:
          GH_TOKEN: ${{ github.token }}
          DOCTOR_NAME: "Доктор гейтов — самозажив транзиентов (волна 7)"
        run: |
          set -u
          REPO="${{ github.repository }}"
          BR=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/$REPO" | python3 -c "import sys,json;print(json.load(sys.stdin)['default_branch'])")
          echo "доктор-дозор: тело $REPO, дефолтная ветка $BR"
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/$REPO/actions/runs?per_page=40" \
               | python3 -c "import sys,json;d=json.load(sys.stdin);[print(r['id'],r['name'],sep='|TAB|') for r in d.get('workflow_runs',[]) if r.get('conclusion')=='failure' and r.get('run_attempt')==1 and r.get('head_branch')==sys.argv[1] and r.get('event')!='workflow_run' and r.get('name')!=sys.argv[2]]" "$BR" "$DOCTOR_NAME" | sed 's/|TAB|/	/' > /tmp/red_attempt1.txt || true
          if [ ! -s /tmp/red_attempt1.txt ]; then
            echo "доктор-дозор: красных attempt=1 на $BR не найдено — дом чист"
            exit 0
          fi
          while IFS="$(printf '\t')" read -r rid wfname; do
            code=$(curl -s -o /tmp/heal.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: polimat-wave8-doctor-nous" \
              "https://api.github.com/repos/$REPO/actions/runs/${rid}/rerun-failed-jobs")
            echo "доктор-дозор: rerun-failed-jobs(run=$rid, $wfname) -> HTTP $code"
            head -c 200 /tmp/heal.json; echo
            case "$code" in
              201|202) echo "доктор-дозор: реран принят — attempt 2 пошёл (финальная попытка)" ;;
              *) echo "доктор-дозор: реран отклонён (HTTP $code) — честно остаёмся в логе, гейт не подмазан" ;;
            esac
          done < /tmp/red_attempt1.txt
          exit 0
