name: ci

# ВЕРИФИКАЦИЯ: карта сверяется с территорией на каждый push и PR.
# Правила безопасности: пины по полному SHA (tj-actions), persist-credentials: false,
# минимальные permissions (Shai-Hulud). Пины и даты — manifests/pins.yaml.

on:
  push:
    branches: [main, 'agents/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify — исполняемая карта
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: deps
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: tests (структура, workflows, связи документов)
        run: python -m unittest discover -s tests -v
      - name: shellcheck (рефлексы scripts/)
        run: shellcheck scripts/*.sh

  security:
    name: security — секреты и воркфлоу
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: deps
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: zizmor (аудит воркфлоу)
        run: zizmor --no-progress .github/workflows
      - name: pre-commit (gitleaks + гигиена файлов)
        run: pre-commit run --all-files

  docs:
    name: docs — Диатаксис собирается строго
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: deps
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: llms.txt (генерация для агентов)
        run: bash scripts/gen_llms.sh
      - name: mkdocs build --strict
        run: mkdocs build --strict
      # Артефакт эфемерен (retention 14 дней) — доставка best-effort, не гейт:
      # квотная рана storage аккаунта не должна краснить строгую сборку
      # (гейт выше, mkdocs --strict, остаётся строгим; TH-RTP-06).
      - name: артефакт docs-сайт + llms.txt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: docs-site
          path: |
            site/
            llms.txt
          retention-days: 3
