name: release

# РЕЛИЗ ОТДЕЛЁН ОТ CI (урок Shai-Hulud): запускается только по тегу v* или вручную.
# Публикация в реестры — вне этого репо; здесь — сборка, контрольные суммы, артефакты.
# Аттестация (SLSA Build L2) включается переменной репо ENABLE_ATTESTATION=1
# и требует поддержки attestations (на приватном репо — GitHub Enterprise Cloud).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-docs:
    name: release — docs-срез + SHA256SUMS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write     # под аттестационный шаг за гейтом ENABLE_ATTESTATION (ADR-0003)
      attestations: write # без сработавшего гейта шаг не исполняется
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: deps
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: сборка docs
        run: |
          bash scripts/gen_llms.sh
          mkdocs build --strict
          cp llms.txt site/llms.txt
      - name: архив + SHA256SUMS
        run: |
          tar -czf nous-docs-site.tar.gz -C site .
          sha256sum nous-docs-site.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: аттестация провенанса (гейт ENABLE_ATTESTATION=1)
        if: vars.ENABLE_ATTESTATION == '1'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject_path: nous-docs-site.tar.gz
          subject_name: nous-docs-site
      - name: артефакты релиза
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nous-release-${{ github.ref_name }}
          path: |
            nous-docs-site.tar.gz
            SHA256SUMS.txt
          retention-days: 90
