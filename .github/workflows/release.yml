name: release

# РЕЛИЗ ОТДЕЛЁН ОТ CI (урок Shai-Hulud): запускается только по тегу v* или вручную.
# Публикация в реестры — вне этого репо; здесь — сборка, контрольные суммы, артефакты.
# Аттестация (SLSA Build L2) включается переменной репо ENABLE_ATTESTATION=1
# и требует поддержки attestations (на приватном репо — GitHub Enterprise Cloud).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-docs:
    name: release — docs-срез + SHA256SUMS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: deps
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: сборка docs
        run: |
          bash scripts/gen_llms.sh
          mkdocs build --strict
          cp llms.txt site/llms.txt
      - name: архив + SHA256SUMS
        run: |
          tar -czf nous-docs-site.tar.gz -C site .
          sha256sum nous-docs-site.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: аттестация провенанса (гейт ENABLE_ATTESTATION=1)
        if: vars.ENABLE_ATTESTATION == '1'
        uses: actions/attest-build-provenance@db473fddc028af60658334401dc6fa3ffd8669fd # v2.3.0
        with:
          subject_path: nous-docs-site.tar.gz
          subject_name: nous-docs-site
      - name: артефакты релиза
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nous-release-${{ github.ref_name }}
          path: |
            nous-docs-site.tar.gz
            SHA256SUMS.txt
          retention-days: 90
