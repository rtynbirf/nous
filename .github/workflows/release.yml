name: release

# РЕЛИЗ ОТДЕЛЁН ОТ CI (урок Shai-Hulud): запускается только по тегу v* или вручную.
# Публикация в реестры — вне этого репо; здесь — сборка, контрольные суммы, артефакты.
# Аттестация (SLSA Build L2) включается переменной репо ENABLE_ATTESTATION=1
# и требует поддержки attestations (на приватном репо — GitHub Enterprise Cloud).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-docs:
    name: release — docs-срез + SHA256SUMS
    runs-on: ubuntu-latest
    permissions:
      # contents: write — издание GitHub Release по тегу (ADR-0016);
      # чтение ассетов прошлого релиза мембраной покрывается тем же правом
      contents: write
      id-token: write     # под аттестационный шаг за гейтом ENABLE_ATTESTATION (ADR-0003)
      attestations: write # без сработавшего гейта шаг не исполняется
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: deps
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: SBOM (CycloneDX 1.6 + SPDX 2.3.1) — ADR-0015
        run: |
          python3 scripts/gen_sbom.py gen --cyclonedx sbom-cyclonedx.json --spdx sbom-spdx.json
          python3 scripts/gen_sbom.py verify --cyclonedx sbom-cyclonedx.json --spdx sbom-spdx.json
      - name: сборка docs
        run: |
          bash scripts/gen_llms.sh
          mkdocs build --strict
          cp llms.txt site/llms.txt
      - name: архив + SHA256SUMS (суммы пишутся последними)
        run: |
          tar -czf nous-docs-site.tar.gz -C site .
          sha256sum nous-docs-site.tar.gz sbom-cyclonedx.json sbom-spdx.json > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: мембрана 1/2 — самопроверка свежесобранного набора (ADR-0016)
        run: python3 scripts/release_membrane.py self-check
      - name: мембрана 2/2 — сверка с последним изданным релизом + SBOM-drift (ADR-0016)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release_membrane.py gate --fail-on-change
      - name: аттестация 1/4 — nous-docs-site.tar.gz (гейт ENABLE_ATTESTATION=1)
        if: vars.ENABLE_ATTESTATION == '1'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject_path: nous-docs-site.tar.gz
          subject_name: nous-docs-site.tar.gz
      - name: аттестация 2/4 — sbom-cyclonedx.json
        if: vars.ENABLE_ATTESTATION == '1'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject_path: sbom-cyclonedx.json
          subject_name: sbom-cyclonedx.json
      - name: аттестация 3/4 — sbom-spdx.json
        if: vars.ENABLE_ATTESTATION == '1'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject_path: sbom-spdx.json
          subject_name: sbom-spdx.json
      - name: аттестация 4/4 — SHA256SUMS.txt
        if: vars.ENABLE_ATTESTATION == '1'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject_path: SHA256SUMS.txt
          subject_name: SHA256SUMS.txt
      - name: артефакты релиза — точный набор (ADR-0015)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nous-release-${{ github.ref_name }}
          path: |
            nous-docs-site.tar.gz
            sbom-cyclonedx.json
            sbom-spdx.json
            SHA256SUMS.txt
          retention-days: 90
      - name: издание — тег превращается в GitHub Release с точным набором (ADR-0016)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "nous ${GITHUB_REF_NAME}" \
            --notes "Точный набор (ADR-0015/0016): docs-тарболл, SBOM CycloneDX 1.6 + SPDX 2.3.1, SHA256SUMS.txt (суммы — последними). Мембрана сверила набор с предыдущим изданным релизом." \
            nous-docs-site.tar.gz sbom-cyclonedx.json sbom-spdx.json SHA256SUMS.txt
