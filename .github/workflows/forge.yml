name: forge-linux

# ФОРЖ LINUX В CI (ADR-0009): ночная сборка обеих целей + ручной прогон выбранной.
# Safe-defaults (manifests/safe-defaults.yaml): auto_publish=false — артефакты
# остаются только в артефактах этого прогона (retention 14 дней), не в релизах
# и не в ветках. Правила безопасности: пины по полному SHA (ADR-0004; единственный
# lockfile — manifests/pins.yaml, ADR-0010), persist-credentials: false,
# минимальные permissions, continue-on-error нет: честный красный лучше зелёной лжи.
# Пароль установки рождается на раннере (openssl rand) и умирает с раннером:
# в репо, в логах и в артефактах его нет — хеш живёт только в окружении job'а.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Цель форжа: ручной прогон собирает только её; ночной — обе'
        type: choice
        required: true
        default: debian12
        options:
          - debian12
          - ubuntu-2404
      auto_publish:
        description: 'П-14: ISO-артефакт выгружается только при true (релиз/релизная ветка); штатный прогон несёт лог+SHA256SUMS'
        type: boolean
        required: false
        default: false
  schedule:
    # 02:37 UTC — ночная сборка: нечётное время против пиков (шаблонные кроны бьют в :00)
    - cron: '37 2 * * *'

permissions:
  contents: read

jobs:
  forge-linux:
    name: forge-linux — ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      # провал одной цели не отменяет вторую: обе диагностики ценны
      fail-fast: false
      matrix:
        target: [debian12, ubuntu-2404]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: инструменты форжа (xorriso, gnupg, isolinux; grub-pc-bin+mtools — ESP тикета 0008; qemu+ovmf — boot-гейт)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso gnupg curl isolinux grub-pc-bin mtools dosfstools qemu-system-x86 ovmf

      - name: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: deps (pyyaml для генераторов форжа)
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: одноразовый пароль (живёт только в раннере, в репо и лог не попадает)
        shell: bash
        run: |
          echo "NOUS_PW_HASH=$(openssl passwd -6 -salt nous-ephemeral "$(openssl rand -base64 24)")" >> "$GITHUB_ENV"

      # ручной прогон собирает выбранную цель (inputs.target); ночной (schedule) — обе
      - name: форж ${{ matrix.target }} → dist/
        if: github.event_name == 'schedule' || matrix.target == inputs.target
        shell: bash
        run: NOUS_TARGET_DIR=${{ github.workspace }}/dist bash src/forge/linux/build.sh ${{ matrix.target }}

      - name: верификация артефакта (спека 05; glob раскрывает bash — без совпадений честный FAIL)
        if: github.event_name == 'schedule' || matrix.target == inputs.target
        shell: bash
        run: bash src/lib/verify-iso.sh dist/linux/*/*.iso

      - name: 'счёт артефактов без тела — SHA256SUMS и лог всегда, ISO только при публикации (П-14)'
        if: github.event_name == 'schedule' || matrix.target == inputs.target
        shell: bash
        run: |
          {
            echo "## П-14 артефакт-бюджет: штатный прогон не выгружает ISO (880 МБ > квоты free)"
            find dist -type f -name '*.iso' -exec sha256sum {} \; || true
            echo "## состав dist"
            find dist -type f -printf '%s %p\n' | sort -k2
          } > forge-artifacts-log.txt
          cat forge-artifacts-log.txt
          echo "sha256_iso=$(grep -c sha256 forge-artifacts-log.txt || true)"

      - name: лёгкий артефакт — лог + суммы (носитель опционален: квотная тюрьма не роняет факт)
        if: github.event_name == 'schedule' || matrix.target == inputs.target
        continue-on-error: true   # П-14: факт sha256 уже напечатан в логе шага-8; артефакт — только носитель
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forge-linux-${{ matrix.target }}-log
          path: forge-artifacts-log.txt
          retention-days: 1
          if-no-files-found: warn

      - name: полный ISO-артефакт (только при auto_publish=true — релиз/релизная ветка)
        if: (github.event_name == 'schedule' || matrix.target == inputs.target) && inputs.auto_publish == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forge-linux-${{ matrix.target }}
          path: dist/
          retention-days: 3
