site_name: НОУС
site_description: Эмерджентное сингулярное репо — конституция для человека и агентов
site_author: rtynbirf
repo_url: https://github.com/rtynbirf/nous
repo_name: rtynbirf/nous

theme:
  name: material
  language: ru
  features:
    - content.code.copy
    - navigation.sections
  palette:
    - scheme: default
      primary: indigo
      accent: amber

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

nav:
  - Витрина: index.md
  - Начало:
      - bootstrap: getting-started/01-bootstrap.md
  - Генеалогия:
      - Ревизия-0 (аудит и дифф): genesis/revision-0.md
      - Аудит 15 репо (2026-10-29): genesis/audit-2026-10-29.md
      - Синтез «Public Repo Synthesis»: genesis/sintez-public-repo-synthesis.md
  - Практика:
      - Новый субъект: guides/new-subject.md
      - Ветка исполнения: guides/execution-branch.md
      - Релиз: guides/release.md
  - Понятия:
      - Аксиомы: concepts/axioms.md
      - Карта = территория: concepts/map-territory.md
      - N=СУБЪЕКТ≠ИНДИВИД: concepts/subjects.md
      - Эмерджентный контур: concepts/emergence.md
      - Безопасные дефолты: concepts/safe-defaults.md
  - РАЗБОР 9:
      - Витрина досье: razbor/index.md
      - Аудит монолога исполнителя: razbor/audit-razbor-9-monolog.md
      - Сетевая разведка вопроса: razbor/dossier-research.md
      - КОСТЬ 0: razbor/kost-0.md
      - "Материал: монолог исполнителя": razbor/material-monolog-ispolnitelya.md
  - SINGULARIS:
      - О контуре: singularis/index.md
      - Манифест: singularis/manifest.md
      - Видение: singularis/vision.md
      - Аксиомы 2.0: singularis/axioms-v2.md
      - Архитектура: singularis/architecture.md
      - Безопасность: singularis/safety-governance.md
  - Спеки:
      - ТЗ форжа: spec/tz-nous-forge.md
      - Дорожная карта: spec/roadmap.md
      - ТЗ SINGULARIS: spec/singularis/tz-singularis.md
      - Runtime субъектов: spec/singularis/runtime-spec.md
      - Evidence-протокол: spec/singularis/evidence-protocol.md
      - Схема контракта: spec/singularis/contract-schema.md
      - Дорожная карта SINGULARIS: spec/roadmap-singularis.md
      - Реализация 01 Источники: spec/implementation/01-sources.md
      - Реализация 02 Probe: spec/implementation/02-probe.md
      - Реализация 03 Windows ISO: spec/implementation/03-windows-iso.md
      - Реализация 04 Linux ISO: spec/implementation/04-linux-iso.md
      - Реализация 05 Verify: spec/implementation/05-verify.md
      - Реализация 06 Безопасные дефолты: spec/implementation/06-safe-defaults.md
      - Реализация 07 Диспетчеризация: spec/implementation/07-agent-dispatch.md
  - Решения (ADR):
      - 0001 SSOT-монорепо: decisions/0001-ssot-monorepo.md
      - 0002 AGENTS.md-конституция: decisions/0002-agents-md-constitution.md
      - 0003 Разделение CI и release: decisions/0003-split-ci-release.md
      - 0004 Пин actions по SHA: decisions/0004-pin-actions-by-sha.md
      - 0005 Русский язык документов: decisions/0005-russian-language.md
      - 0006 manifests как калибровка: decisions/0006-manifests-pins.md
