      - 0008 actions.lock позже: decisions/0008-actions-lock-deferred.md
      - 0009 CI-раннер = одноразовый хост: decisions/0009-ci-forge-runner.md
      - 0010 pins.yaml — единственный lockfile: decisions/0010-pins-yaml-single-lockfile.md
      - 0011 Журнал доказательств: decisions/0011-evidence-ledger.md
      - 0012 Доктрина секретов: decisions/0012-secrets-doctrine.md
      - 0013 Принятие SINGULARIS: decisions/0013-singularis-adoption.md
      - 0014 Runtime-harness MVA-H: decisions/0014-runtime-harness-mvah.md
  - Референс:
      - Структура: reference/structure.md
      - Команды: reference/commands.md
      - Runtime-harness MVA-H: reference/harness.md
      - Базовый уровень безопасности: reference/security-baseline.md
      - Каталог инструментов: reference/tools-catalog.md
